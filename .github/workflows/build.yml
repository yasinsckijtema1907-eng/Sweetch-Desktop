name: Sweetch Desktop Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/Sweetch.Tests -c Release
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Verify packaged app
        shell: pwsh
        run: |
          $p = Start-Process ./publish/SweetchDesktop.exe -ArgumentList '--self-test', './self-test' -PassThru -Wait -WindowStyle Hidden
          Get-Content ./self-test/self-test.txt
          if ($p.ExitCode -ne 0) { throw 'Sweetch self-test failed' }
      - name: Package
        shell: pwsh
        run: |
          ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SweetchDesktop-1.0.2-Windows
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SweetchDesktop-verification
          path: self-test
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SweetchDesktop-1.0.2-Windows
          path: artifacts
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            for (const name of fs.readdirSync('artifacts')) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: context.payload.release.id,
                name,
                data: fs.readFileSync(`artifacts/${name}`)
              });
            }
